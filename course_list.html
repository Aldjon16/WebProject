{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">📚 Kurset</h2>

<div class="row">
    {% for course in courses %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">{{ course.title }}</h5>
                    <p class="card-text">
                        {{ course.description|truncatewords:20 }}
                    </p>

                    {% if user.is_authenticated %}
                        <a href="{% url 'course_detail' course.pk %}" class="btn btn-primary w-100">
                            Shiko Kursin
                        </a>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">
                            Kyçu për detaje
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    {% empty %}
        <p>Nuk ka ende kurse.</p>
    {% endfor %}
</div>
{% endblock %}
