{% extends "base.html" %}

{% block title %}Kyçu - GjejMjeshtrin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="fas fa-sign-in-alt text-primary"></i> Kyçu
                </h3>
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Emri i përdoruesit</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Fjalëkalimi</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Kyçu</button>
                </form>
                <hr>
                <p class="text-center mb-0">
                    Nuk keni llogari? <a href="{{ url_for('auth.register') }}">Regjistrohu këtu</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
